<!doctype html>
<html lang="en" class="page">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Dia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="./styles/styles.scss"
    />
  </head>

  <body class="page__body">
    <header class="header page__header">
      <div class="container">
        <div class="header__content">
          <div class="top-bar header__top-bar">
            <div class="top-bar__logo-and-list">
              <div class="top-bar__icons">
                <a href="#" class="icon icon--logo"></a>
                <a href="#menu" class="icon icon--menu"></a>
              </div>

              <nav class="nav header__nav">
                <ul class="nav__list">
                  <li class="nav__item"><a href="#about-us" class="nav__link">About us</a></li>
                  <li class="nav__item"><a href="#services" class="nav__link">Services</a></li>
                  <li class="nav__item"><a href="#testimonilas" class="nav__link">Testimonials</a></li>
                  <li class="nav__item"><a href="#contact-us" class="nav__link">Contact Us</a></li>
                </ul>
              </nav>
            </div>


            <a href="#" class="top-bar__hire-us">Hire us</a>
          </div>

          <h1 class="header__title">Strategic Agency</h1>
          <p class="header__description">We believe in the power of bold ideas that can solve business challenges.</p>
          <a href="#" class="button header__button">Learn more</a>
        </div>
      </div>

      <div class="swiper mySwiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img src="/src/images/slider/slider-photo-1.png" alt="The clock on the hand">
          </div>
          <div class="swiper-slide">
            <img src="/src/images/slider/slider-photo-2.png" alt="Thw working place">
          </div>
          <div class="swiper-slide">
            <img src="/src/images/slider/slider-photo-3.png" alt="The working place">
          </div>
        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
      </div>

      <!-- Swiper JS -->
      <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

      <!-- Initialize Swiper -->
      <script>
        var swiper = new Swiper(".mySwiper", {
          navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev",
          },
        });
      </script>
    </header>
  </body>
</html>
